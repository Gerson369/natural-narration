interface:
  display_name: "自然口播 Natural Narration"
  short_description: "中文口播 / 科普 / 人物 / 方法论 / 慢创业 / 纪录片文稿的去 AI 味、去说服腔、故事层、价值链、证据弧线、现实类比边界，以及语义保真、作者声音与文件结构保护。"
  default_prompt: "$natural-narration 把这份口播稿洗成自然人话：删掉人工悬念、二元反转、主持人腔、伪金句、强行升华以及绝对化承诺和身份优越句，必要时补上具体场景与状态变化，保留全部事实、数字和开头钩子；不用空泛价值句充当结论；证据必须推动判断，并区分事实、推论和类比边界；先锁定否定、确定程度、状态、条件、范围、归因和因果再改写，通顺的句子原样保留。"
policy:
  allow_implicit_invocation: true

